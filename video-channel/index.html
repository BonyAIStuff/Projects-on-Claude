<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000000;
        --ink: #ffffff;
        --accent: #ff4d2e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, sans-serif; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #lower-third { position: absolute; left: 192px; bottom: 140px; z-index: 2; }
      #lower-third-card {
        display: inline-block; padding: 24px 40px; background: rgba(0, 0, 0, 0.75);
        border-left: 10px solid var(--accent); color: var(--ink); font-size: 56px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <!-- Trim: play source seconds 2–7 of assets/sample.mp4 -->
      <video id="footage" class="clip" src="assets/sample.mp4" data-start="0" data-duration="5"
        data-media-start="2" data-has-audio="true" data-track-index="0"></video>
      <div id="lower-third" class="clip" data-start="0.5" data-duration="4" data-track-index="1">
        <div id="lower-third-card">HyperFrames is set up</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lower-third-card", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.to("#lower-third-card", { opacity: 0, x: -60, duration: 0.4, ease: "power2.in" }, 4.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
